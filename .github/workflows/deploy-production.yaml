name: Deploy (production)

# Validate the whole monorepo, then deploy every package to the Cloudflare
# `production` environment in parallel. Runs when a stable GitHub release is
# published, or manually via the Actions tab.
on:
  workflow_dispatch:
  release:
    # `released` excludes pre-releases (betas/RCs) — they would otherwise ship
    # to prod via `published`. Switch to `published` if pre-releases should deploy.
    types: [released]

# Read-only by default; the deploy jobs authenticate to Cloudflare with secrets.
permissions:
  contents: read

# One production deploy at a time. Unlike development we do NOT cancel an
# in-progress run — a half-applied production deploy is worse than a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Build, test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test:coverage
      - run: pnpm build

  deploy-worker:
    name: Deploy worker
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - run: pnpm --filter @rivus/worker exec wrangler deploy --env production

  deploy-docs:
    name: Deploy docs
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Crawlable: emits an allow-all robots.txt for the production docs.
      RIVUS_ENV: production
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - run: pnpm --filter @rivus/docs build
      - run: pnpm --filter @rivus/docs exec wrangler deploy --env production

  deploy-app:
    name: Deploy app
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Crawlable: emits an allow-all robots.txt for the production app.
      RIVUS_ENV: production
      # Baked into the Expo web bundle at export time.
      EXPO_PUBLIC_API_URL: https://api.rivus.ai
      # Optional: address-autocomplete key (referrer-restricted). Unset → plain field.
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - run: pnpm --filter @rivus/app export:web
      # The signup address field needs the Maps key inlined into the web bundle;
      # if config.ts ever stops reading it as a literal process.env.* expression
      # the value silently drops out and autocomplete degrades to a text field.
      - name: Verify the Maps key inlined into the web bundle
        run: |
          if [ -z "$EXPO_PUBLIC_GOOGLE_MAPS_API_KEY" ]; then
            echo "::warning::EXPO_PUBLIC_GOOGLE_MAPS_API_KEY is unset — signup address autocomplete will be a plain text field"
          elif grep -rqF "$EXPO_PUBLIC_GOOGLE_MAPS_API_KEY" packages/app/dist/; then
            echo "Google Maps key inlined into the web bundle ✓"
          else
            echo "::error::EXPO_PUBLIC_GOOGLE_MAPS_API_KEY is set but did not inline into the bundle"
            exit 1
          fi
      - run: pnpm --filter @rivus/app exec wrangler deploy --env production

  deploy-website:
    name: Deploy website
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Crawlable: allow-all robots.txt and indexable metadata for the
      # production site; read at build time by robots.ts and the root layout.
      RIVUS_ENV: production
      # Inlined into the Next client bundle by `next build` (run inside the
      # OpenNext build).
      NEXT_PUBLIC_API_URL: https://api.rivus.ai
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      - run: pnpm --filter @rivus/website exec opennextjs-cloudflare build
      - run: pnpm --filter @rivus/website exec opennextjs-cloudflare deploy -- --env production

  deploy-api:
    name: Deploy api (container)
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_MONGODB_URI: ${{ secrets.PROD_MONGODB_URI }}
      PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
      PROD_RESEND_API_KEY: ${{ secrets.PROD_RESEND_API_KEY }}
      # Optional: enables the AI duplicate-FAQ check. Unset → the check is a no-op.
      PROD_OPENAI_API_KEY: ${{ secrets.PROD_OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/setup
      # The container always runs with NODE_ENV=production, where the API refuses
      # to boot without a real MONGODB_URI, a strong JWT_SECRET, and a RESEND_API_KEY
      # (passwordless auth emails the sign-in code). Fail fast rather than replace
      # api.rivus.ai with a container that crash-loops.
      - name: Require API secrets
        run: |
          if [ -z "$PROD_MONGODB_URI" ] || [ -z "$PROD_JWT_SECRET" ] || [ -z "$PROD_RESEND_API_KEY" ]; then
            echo "::error::Set PROD_MONGODB_URI, PROD_JWT_SECRET, and PROD_RESEND_API_KEY in the production environment before deploying the API."
            exit 1
          fi
      # wrangler builds the Dockerfile (Docker is preinstalled on ubuntu-latest)
      # and pushes the image to Cloudflare's registry before deploying the Worker.
      - run: pnpm --filter @rivus/api exec wrangler deploy --env production
      # Keep the Worker's secrets in sync (all are guaranteed present above).
      - name: Sync API secrets
        run: |
          printf '%s' "$PROD_MONGODB_URI" | pnpm --filter @rivus/api exec wrangler secret put MONGODB_URI --env production
          printf '%s' "$PROD_JWT_SECRET" | pnpm --filter @rivus/api exec wrangler secret put JWT_SECRET --env production
          printf '%s' "$PROD_RESEND_API_KEY" | pnpm --filter @rivus/api exec wrangler secret put RESEND_API_KEY --env production
      # Optional AI key — pushed only when set, so an unset secret never reaches the
      # container as an empty value (which would fail loadConfig's min(1) and crash-loop it).
      - name: Sync optional AI secret
        if: ${{ env.PROD_OPENAI_API_KEY != '' }}
        run: |
          printf '%s' "$PROD_OPENAI_API_KEY" | pnpm --filter @rivus/api exec wrangler secret put OPENAI_API_KEY --env production
