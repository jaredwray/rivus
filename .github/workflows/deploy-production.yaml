name: Deploy (production)

# Validate the whole monorepo, then deploy every package to the Cloudflare
# `production` environment in parallel. Runs when a stable GitHub release is
# published, or manually via the Actions tab.
on:
  workflow_dispatch:
  release:
    # `released` excludes pre-releases (betas/RCs) — they would otherwise ship
    # to prod via `published`. Switch to `published` if pre-releases should deploy.
    types: [released]

# Read-only by default; the deploy jobs authenticate to Cloudflare with secrets.
permissions:
  contents: read

# One production deploy at a time. Unlike development we do NOT cancel an
# in-progress run — a half-applied production deploy is worse than a queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    name: Build, test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test:coverage
      - run: pnpm build

  # Every deploy job binds `environment: production` so it can read that
  # environment's secrets and so the environment's protection rules (e.g. a
  # required reviewer) gate the deploy itself. Without the binding, `secrets.*`
  # below resolve only against repository-level secrets, and a protection rule
  # would gate nothing but the bookkeeping job at the bottom — which runs after
  # everything is already live. The cost is one deployment record per job rather
  # than one per run; `record-deployment` is the only job carrying a `url`, so it
  # stays the environment's "active" deployment.
  deploy-docs:
    name: Deploy docs
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Crawlable: emits an allow-all robots.txt for the production docs.
      RIVUS_ENV: production
      # Optional: with a token, Docula pulls contributors and repo metadata into
      # the build (site/docula.config.ts gates `githubPath` on it). The default
      # workflow token is enough — `permissions: contents: read` covers it.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - uses: ./.github/actions/setup
      - run: pnpm --filter @rivus/docs build
      - run: pnpm --filter @rivus/docs exec wrangler deploy --env production

  deploy-app:
    name: Deploy app
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Crawlable: emits an allow-all robots.txt for the production app.
      RIVUS_ENV: production
      # Inlined into the Expo web bundle; the explicit `production` value keeps the
      # staff-only account seeder out of the production app (it never renders).
      EXPO_PUBLIC_RIVUS_ENV: production
      # Baked into the Expo web bundle at export time. Chat (`/v1/chat`) rides
      # on the same API base URL — there is no separate agent service.
      EXPO_PUBLIC_API_URL: https://api.rivus.ai
      # Optional: address-autocomplete key (referrer-restricted). Unset → plain field.
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - uses: ./.github/actions/setup
      - run: pnpm --filter @rivus/app export:web
      # The signup address field needs the Maps key inlined into the web bundle;
      # if config.ts ever stops reading it as a literal process.env.* expression
      # the value silently drops out and autocomplete degrades to a text field.
      - name: Verify the Maps key inlined into the web bundle
        run: |
          if [ -z "$EXPO_PUBLIC_GOOGLE_MAPS_API_KEY" ]; then
            echo "::warning::EXPO_PUBLIC_GOOGLE_MAPS_API_KEY is unset — signup address autocomplete will be a plain text field"
          elif grep -rqF "$EXPO_PUBLIC_GOOGLE_MAPS_API_KEY" packages/app/dist/; then
            echo "Google Maps key inlined into the web bundle ✓"
          else
            echo "::error::EXPO_PUBLIC_GOOGLE_MAPS_API_KEY is set but did not inline into the bundle"
            exit 1
          fi
      - run: pnpm --filter @rivus/app exec wrangler deploy --env production

  deploy-website:
    name: Deploy website
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Crawlable: allow-all robots.txt and indexable metadata for the
      # production site; read at build time by robots.txt.ts and the root layout.
      RIVUS_ENV: production
      # Inlined into the Astro client islands by `astro build`.
      PUBLIC_API_URL: https://api.rivus.ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - uses: ./.github/actions/setup
      - run: pnpm --filter @rivus/website build
      - run: pnpm --filter @rivus/website exec wrangler deploy --env production

  deploy-api:
    name: Deploy api (container)
    needs: validate
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PROD_MONGODB_URI: ${{ secrets.PROD_MONGODB_URI }}
      PROD_JWT_SECRET: ${{ secrets.PROD_JWT_SECRET }}
      PROD_RESEND_API_KEY: ${{ secrets.PROD_RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - uses: ./.github/actions/setup
      # The container always runs with NODE_ENV=production, where the API refuses
      # to boot without a real MONGODB_URI, a strong JWT_SECRET, and a RESEND_API_KEY
      # (passwordless auth emails the sign-in code). Fail fast rather than replace
      # api.rivus.ai with a container that crash-loops.
      - name: Require API secrets
        run: |
          if [ -z "$PROD_MONGODB_URI" ] || [ -z "$PROD_JWT_SECRET" ] || [ -z "$PROD_RESEND_API_KEY" ]; then
            echo "::error::Set PROD_MONGODB_URI, PROD_JWT_SECRET, and PROD_RESEND_API_KEY in the production environment before deploying the API."
            exit 1
          fi
      # wrangler builds the Dockerfile (Docker is preinstalled on ubuntu-latest)
      # and pushes the image to Cloudflare's registry before deploying the Worker.
      - run: pnpm --filter @rivus/api exec wrangler deploy --env production
      # Keep the Worker's secrets in sync (all are guaranteed present above).
      - name: Sync API secrets
        run: |
          printf '%s' "$PROD_MONGODB_URI" | pnpm --filter @rivus/api exec wrangler secret put MONGODB_URI --env production
          printf '%s' "$PROD_JWT_SECRET" | pnpm --filter @rivus/api exec wrangler secret put JWT_SECRET --env production
          printf '%s' "$PROD_RESEND_API_KEY" | pnpm --filter @rivus/api exec wrangler secret put RESEND_API_KEY --env production
      # Every optional integration, in one pass. Each Worker secret is pushed only
      # when its GitHub secret is set, so an unset one never reaches the container
      # as an empty string — `loadConfig`'s `min(1)` would reject that and
      # crash-loop the container. Unset simply means the feature stays off:
      # the channels degrade to no-ops, the audit answers "not enabled", and the
      # signed webhook routes answer 503 rather than accepting unsigned traffic.
      #
      # This syncs; it never unsets. Removing a GitHub secret leaves the Worker's
      # copy in place — retire an integration with
      # `wrangler secret delete <NAME> --env production`.
      - name: Sync optional API secrets
        env:
          # AI providers: OpenAI is primary, the rest are ordered fallbacks.
          OPENAI_API_KEY: ${{ secrets.PROD_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.PROD_ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.PROD_GOOGLE_GENERATIVE_AI_API_KEY }}
          XAI_API_KEY: ${{ secrets.PROD_XAI_API_KEY }}
          # Agent email channel (Resend inbound webhook).
          RESEND_WEBHOOK_SECRET: ${{ secrets.PROD_RESEND_WEBHOOK_SECRET }}
          # The chat's website audit.
          ZENROWS_API_KEY: ${{ secrets.PROD_ZENROWS_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.PROD_BRAVE_SEARCH_API_KEY }}
          # Phone-number channels (WhatsApp / SMS / voice). Twilio is primary;
          # Plivo is retained for the numbers it still owns during the migration;
          # zernio is the WhatsApp-only alternative. Their non-secret webhook URLs
          # and API bases live in packages/api/wrangler.jsonc `vars`.
          TWILIO_ACCOUNT_SID: ${{ secrets.PROD_TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.PROD_TWILIO_AUTH_TOKEN }}
          PLIVO_AUTH_ID: ${{ secrets.PROD_PLIVO_AUTH_ID }}
          PLIVO_AUTH_TOKEN: ${{ secrets.PROD_PLIVO_AUTH_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.PROD_ZERNIO_API_KEY }}
          ZERNIO_WEBHOOK_SECRET: ${{ secrets.PROD_ZERNIO_WEBHOOK_SECRET }}
          ZERNIO_VERIFY_TOKEN: ${{ secrets.PROD_ZERNIO_VERIFY_TOKEN }}
        run: |
          for name in \
            OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_GENERATIVE_AI_API_KEY XAI_API_KEY \
            RESEND_WEBHOOK_SECRET ZENROWS_API_KEY BRAVE_SEARCH_API_KEY \
            TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN PLIVO_AUTH_ID PLIVO_AUTH_TOKEN \
            ZERNIO_API_KEY ZERNIO_WEBHOOK_SECRET ZERNIO_VERIFY_TOKEN; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | pnpm --filter @rivus/api exec wrangler secret put "$name" --env production
              echo "synced $name"
            else
              echo "skipped $name (no GitHub secret set)"
            fi
          done

  # The four service deploys above all ship to the single Cloudflare `production`
  # environment, and each binds `environment: production` so it can read that
  # environment's secrets (see the note above `deploy-docs`). This job is what
  # gives the run a single deployment carrying the environment URL: it is the
  # last to run, so it settles as the "active" production deployment instead of
  # the four service jobs racing for it.
  record-deployment:
    name: Record production deployment
    needs: [deploy-docs, deploy-app, deploy-website, deploy-api]
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://rivus.ai
    steps:
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - run: echo "All production services deployed for ${{ github.sha }}"
