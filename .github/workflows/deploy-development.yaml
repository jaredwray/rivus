name: Deploy (development)

# Validate the whole monorepo, then deploy every package to the Cloudflare
# `development` environment in parallel. Runs on every push to main, or manually.
on:
  workflow_dispatch:
  push:
    branches: [main]

# Read-only by default; the deploy jobs authenticate to Cloudflare with secrets.
permissions:
  contents: read

# One development deploy at a time per ref; cancel superseded runs.
concurrency:
  group: deploy-development-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Build, test & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm type-check
      - run: pnpm test:coverage
      - run: pnpm build

  # Every deploy job binds `environment: development` so it can read that
  # environment's secrets and so the environment's protection rules gate the
  # deploy itself. Without the binding, `secrets.*` below resolve only against
  # repository-level secrets — which also means dev and production could never
  # hold different `CLOUDFLARE_*` values, since the names collide at repo level.
  # The cost is one deployment record per job rather than one per run;
  # `record-deployment` is the only job carrying a `url`, so it stays the
  # environment's "active" deployment.
  deploy-docs:
    name: Deploy docs
    needs: validate
    runs-on: ubuntu-latest
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Selects the disallow-all robots.txt for the dev docs (dev-docs.rivus.ai).
      RIVUS_ENV: development
      # Optional: with a token, Docula pulls contributors and repo metadata into
      # the build (site/docula.config.ts gates `githubPath` on it). The default
      # workflow token is enough — `permissions: contents: read` covers it.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - uses: ./.github/actions/setup
      - run: pnpm --filter @rivus/docs build
      - run: pnpm --filter @rivus/docs exec wrangler deploy --env development

  deploy-app:
    name: Deploy app
    needs: validate
    runs-on: ubuntu-latest
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Selects the disallow-all robots.txt for the dev app (dev-app.rivus.ai).
      RIVUS_ENV: development
      # Inlined into the Expo web bundle; lets the dev app show the staff-only
      # account seeder in Settings (the API enforces the same gate server-side).
      EXPO_PUBLIC_RIVUS_ENV: development
      # Baked into the Expo web bundle at export time. Chat (`/v1/chat`) rides
      # on the same API base URL — there is no separate agent service.
      EXPO_PUBLIC_API_URL: https://dev-api.rivus.ai
      # Optional: address-autocomplete key (referrer-restricted). Unset → plain field.
      EXPO_PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.EXPO_PUBLIC_GOOGLE_MAPS_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - uses: ./.github/actions/setup
      - run: pnpm --filter @rivus/app export:web
      # The signup address field needs the Maps key inlined into the web bundle;
      # if config.ts ever stops reading it as a literal process.env.* expression
      # the value silently drops out and autocomplete degrades to a text field.
      - name: Verify the Maps key inlined into the web bundle
        run: |
          if [ -z "$EXPO_PUBLIC_GOOGLE_MAPS_API_KEY" ]; then
            echo "::warning::EXPO_PUBLIC_GOOGLE_MAPS_API_KEY is unset — signup address autocomplete will be a plain text field"
          elif grep -rqF "$EXPO_PUBLIC_GOOGLE_MAPS_API_KEY" packages/app/dist/; then
            echo "Google Maps key inlined into the web bundle ✓"
          else
            echo "::error::EXPO_PUBLIC_GOOGLE_MAPS_API_KEY is set but did not inline into the bundle"
            exit 1
          fi
      - run: pnpm --filter @rivus/app exec wrangler deploy --env development

  deploy-website:
    name: Deploy website
    needs: validate
    runs-on: ubuntu-latest
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # Selects the disallow-all robots.txt + noindex meta for the dev site
      # (dev.rivus.ai); read at build time by robots.ts and the root layout.
      RIVUS_ENV: development
      # Inlined into the Next client bundle by `next build` (run inside the
      # OpenNext build).
      NEXT_PUBLIC_API_URL: https://dev-api.rivus.ai
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - uses: ./.github/actions/setup
      - run: pnpm --filter @rivus/website exec opennextjs-cloudflare build
      - run: pnpm --filter @rivus/website exec opennextjs-cloudflare deploy -- --env development

  deploy-api:
    name: Deploy api (container)
    needs: validate
    runs-on: ubuntu-latest
    environment: development
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      DEV_MONGODB_URI: ${{ secrets.DEV_MONGODB_URI }}
      DEV_JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
      # Passwordless auth emails the sign-in code, so the container (NODE_ENV=
      # production) refuses to boot without this.
      DEV_RESEND_API_KEY: ${{ secrets.DEV_RESEND_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - uses: ./.github/actions/setup
      # wrangler builds the Dockerfile (Docker is preinstalled on ubuntu-latest)
      # and pushes the image to Cloudflare's registry before deploying the Worker.
      - run: pnpm --filter @rivus/api exec wrangler deploy --env development
      # Keep the Worker's secrets in sync. Skipped until the GitHub secrets exist.
      - name: Sync API secrets
        if: ${{ env.DEV_MONGODB_URI != '' }}
        run: |
          printf '%s' "$DEV_MONGODB_URI" | pnpm --filter @rivus/api exec wrangler secret put MONGODB_URI --env development
          printf '%s' "$DEV_JWT_SECRET" | pnpm --filter @rivus/api exec wrangler secret put JWT_SECRET --env development
          printf '%s' "$DEV_RESEND_API_KEY" | pnpm --filter @rivus/api exec wrangler secret put RESEND_API_KEY --env development
      # Every optional integration, in one pass. Each Worker secret is pushed only
      # when its GitHub secret is set, so an unset one never reaches the container
      # as an empty string — `loadConfig`'s `min(1)` would reject that and
      # crash-loop the container. Unset simply means the feature stays off:
      # the channels degrade to no-ops, the audit answers "not enabled", and the
      # signed webhook routes answer 503 rather than accepting unsigned traffic.
      #
      # This syncs; it never unsets. Removing a GitHub secret leaves the Worker's
      # copy in place — retire an integration with
      # `wrangler secret delete <NAME> --env development`.
      - name: Sync optional API secrets
        env:
          # AI providers: OpenAI is primary, the rest are ordered fallbacks.
          OPENAI_API_KEY: ${{ secrets.DEV_OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.DEV_ANTHROPIC_API_KEY }}
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.DEV_GOOGLE_GENERATIVE_AI_API_KEY }}
          XAI_API_KEY: ${{ secrets.DEV_XAI_API_KEY }}
          # Agent email channel (Resend inbound webhook).
          RESEND_WEBHOOK_SECRET: ${{ secrets.DEV_RESEND_WEBHOOK_SECRET }}
          # The chat's website audit.
          ZENROWS_API_KEY: ${{ secrets.DEV_ZENROWS_API_KEY }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.DEV_BRAVE_SEARCH_API_KEY }}
          # Phone-number channels (WhatsApp / SMS / voice). Twilio is primary;
          # Plivo is retained for the numbers it still owns during the migration;
          # zernio is the WhatsApp-only alternative. Their non-secret webhook URLs
          # and API bases live in packages/api/wrangler.jsonc `vars`.
          TWILIO_ACCOUNT_SID: ${{ secrets.DEV_TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.DEV_TWILIO_AUTH_TOKEN }}
          PLIVO_AUTH_ID: ${{ secrets.DEV_PLIVO_AUTH_ID }}
          PLIVO_AUTH_TOKEN: ${{ secrets.DEV_PLIVO_AUTH_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.DEV_ZERNIO_API_KEY }}
          ZERNIO_WEBHOOK_SECRET: ${{ secrets.DEV_ZERNIO_WEBHOOK_SECRET }}
          ZERNIO_VERIFY_TOKEN: ${{ secrets.DEV_ZERNIO_VERIFY_TOKEN }}
        run: |
          for name in \
            OPENAI_API_KEY ANTHROPIC_API_KEY GOOGLE_GENERATIVE_AI_API_KEY XAI_API_KEY \
            RESEND_WEBHOOK_SECRET ZENROWS_API_KEY BRAVE_SEARCH_API_KEY \
            TWILIO_ACCOUNT_SID TWILIO_AUTH_TOKEN PLIVO_AUTH_ID PLIVO_AUTH_TOKEN \
            ZERNIO_API_KEY ZERNIO_WEBHOOK_SECRET ZERNIO_VERIFY_TOKEN; do
            if [ -n "${!name}" ]; then
              printf '%s' "${!name}" | pnpm --filter @rivus/api exec wrangler secret put "$name" --env development
              echo "synced $name"
            else
              echo "skipped $name (no GitHub secret set)"
            fi
          done

  # The four service deploys above all ship to the single Cloudflare `development`
  # environment, and each binds `environment: development` so it can read that
  # environment's secrets (see the note above `deploy-docs`). This job is what
  # gives the run a single deployment carrying the environment URL: it is the
  # last to run, so it settles as the "active" development deployment instead of
  # the four service jobs racing for it.
  record-deployment:
    name: Record development deployment
    needs: [deploy-docs, deploy-app, deploy-website, deploy-api]
    runs-on: ubuntu-latest
    environment:
      name: development
      url: https://dev.rivus.ai
    steps:
      - name: Install Socket Firewall
        uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free
          firewall-version: "1.15.0"
      - run: echo "All development services deployed for ${{ github.sha }}"
