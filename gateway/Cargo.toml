[package]
name = "rivus-gateway"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rivus application gateway: serves static sites from object storage with primary/secondary failover"
repository = "https://github.com/jaredwray/rivus"
publish = false

[dependencies]
async-trait = "0.1"
bytes = "1"
futures = "0.3"
http = "1"
idna = "1"
moka = { version = "0.12", features = ["future"] }
opendal = { version = "0.51", default-features = false, features = ["services-fs", "services-memory", "services-s3", "services-gcs", "services-azblob"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
tracing = "0.1"
