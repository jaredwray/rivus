packages:
  - packages/*

# ---------------------------------------------------------------------------
# Catalog — single source of truth for shared dependency versions.
# Packages reference these with "catalog:" instead of pinning their own range,
# so every workspace stays on the same toolchain version.
# ---------------------------------------------------------------------------
catalog:
  # Language & types
  typescript: ^6.0.0
  '@types/node': ^24.0.0
  # Test toolchain
  vitest: ^4.1.0
  '@vitest/coverage-v8': ^4.1.0
  '@faker-js/faker': ^10.4.0
  # Build
  tsdown: ^0.22.0
  # Lint / format
  '@biomejs/biome': ^2.4.0
  # Validation (shared across api/core)
  zod: ^4.4.0
  # Cloudflare deploy tooling (api, docs, app, website)
  wrangler: ^4.101.0
  '@cloudflare/workers-types': ^4.20260616.1

# ---------------------------------------------------------------------------
# Supply-chain hardening (see agentic/defense-in-depth-nodejs.md §4).
#   - Refuse versions published less than 7 days ago (10080 minutes).
#   - Fail closed instead of silently falling back to a too-new version.
#   - Fail closed when a registry omits publish-time metadata.
# ---------------------------------------------------------------------------
minimumReleaseAge: 10080
minimumReleaseAgeStrict: true
minimumReleaseAgeIgnoreMissingTime: false
# Refuse transitive dependencies that resolve outside the npm registry
# (git/URL/exotic sources anywhere in the graph). The lockfile contains none.
blockExoticSubdeps: true
# Fail if a later-published version has weaker trust evidence than an earlier
# one (trusted publisher → provenance-only → none).
trustPolicy: no-downgrade
# Historical third-party versions published after a later major that already
# had provenance (pnpm checks publish date, not semver). First-party packages
# are never excluded — pin those instead (see overrides.writr).
trustPolicyExclude:
  - semver@6.3.1
  - ua-parser-js@1.0.41
# Fail the install when a dependency's lifecycle script is neither allowed nor
# denied in allowBuilds (no silent ignore of unreviewed build scripts).
strictDepBuilds: true
# Pin first-party writr to a provenance-attested release. 6.1.2 in the
# lockfile is a trust downgrade vs later 6.1.x (docula → writr).
#
# @fastify/jwt still declares fast-jwt ^6.2.4, which would keep the lockfile
# on 6.2.4. That range includes GHSA-ww5h-9m49-7xx4 (RSA public keys with
# non-whitespace prefixes misclassified as HMAC secrets). Force the patched
# 6.3 line.
overrides:
  writr: 6.1.5
  fast-jwt: ^6.3.0

# Install (build) scripts are blocked by default. allowBuilds explicitly
# allows (true) or denies (false) each dependency that ships one. Add entries
# deliberately, never wholesale. (pnpm 11 replaced onlyBuiltDependencies.)
allowBuilds:
  esbuild: true
  workerd: true
  sharp: false
  # Transitive build scripts we deliberately deny: none is needed at runtime.
  # core-js-pure's script only prints a funding notice; the two native modules
  # are optional accelerators (zstd via mongoose, LZMA via the agents SDK's
  # bash skill) that our code never exercises.
  '@mongodb-js/zstd': false
  core-js-pure: false
  node-liblzma: false
